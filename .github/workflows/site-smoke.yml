name: MyPortfolio static smoke
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site structure and JavaScript
        run: python3 tests/site_smoke.py
